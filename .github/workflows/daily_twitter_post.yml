# Daily semester progress tweet.
# Posts at 19:00 Istanbul time (16:00 UTC) every day.
# The bot automatically checks if a semester is active and skips posting if not.

name: Daily Twitter Post

on:
  schedule:
    - cron: '0 16 * * *'  # 19:00 Istanbul time (UTC+3)
  workflow_dispatch:  # Allows manual triggering

jobs:
  post_tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post daily tweet
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: python main.py
